<div class="login-container" [class.is-loading]="loading()">
    <main class="main-content">
        <div class="auth-shell">
        <div class="auth-card">
            <div class="content-title text-center">
                <div class="logo">
                    <img src="/images/logo.png" alt="Logo Almirante Tamandaré">
                </div>
                <h1 class="title">
                    <span class="first-text">Realizar </span>
                    <span class="second-text">Login</span>
                </h1>
            </div>
            <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="input w-100">
                <app-input
                formControlName="email"
                type="email"
                name="email"
                autocomplete="username"
                iconSrc="/icons/letter.svg"
                label="Email"
                [invalid]="!!emailErrorMessage"
                describedBy="login-email-error">
                </app-input>
                @if (emailErrorMessage) {
                    <div class="field-error" id="login-email-error" role="alert">{{ emailErrorMessage }}</div>
                }
                <app-input
                formControlName="password"
                type="password"
                name="password"
                autocomplete="current-password"
                iconSrc="/icons/padlock.svg"
                label="Senha">
                </app-input>
            </div>
            @if (error()) {
                <div class="form-error" role="alert">{{ error() }}</div>
            }
            <div class="button-login w-100">
                <app-button
                type="submit"
                label="Entrar">
                </app-button>
                <div class="first-div"><a href="#" (click)="$event.preventDefault()">Esqueci a senha</a></div>
                <div class="second-div">Não tem conta? <a routerLink="/register">Cadastrar-se</a></div>
            </div>
            </form>
        </div>
    </div>
    </main>
    <div class="footer">
        <div class="img-footer">
            <img src="/images/logo-desbravadores.png" alt="Logo Desbravadores">
        </div>
        <span>Clube de Desbravadores - Almirante Tamandaré</span>
    </div>
    @if (loading()) {
        <div class="loading-overlay" role="status" aria-live="polite" aria-busy="true">
            <div class="loading-box">
                <div class="loading-spinner"></div>
                <span>Validando acesso...</span>
            </div>
        </div>
    }
</div>
