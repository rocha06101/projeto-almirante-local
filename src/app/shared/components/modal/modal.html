<dialog #dialogo [attr.aria-labelledby]="tituloId" [attr.aria-describedby]="descricaoId()"
  (click)="clicarFundo($event)" (cancel)="cancelar($event)">
  <div class="painel" cdkTrapFocus>
    <h2 [id]="tituloId">{{ titulo() }}</h2>
    <div class="conteudo">
      <ng-content />
    </div>
    <footer>
      <ng-content select="[modal-acoes]" />
    </footer>
  </div>
</dialog>
