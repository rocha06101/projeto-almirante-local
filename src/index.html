<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

<script>
  (() => {
    const storageKey = 'app-theme';
    let preference = 'system';

    try {
      const saved = localStorage.getItem(storageKey);
      if (saved === 'light' || saved === 'dark') {
        preference = saved;
      }
    } catch {
      // Se o armazenamento estiver indisponível, usa o tema do sistema.
    }

    const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)')?.matches ?? false;
    const theme = preference === 'system'
      ? (systemDark ? 'dark' : 'light')
      : preference;

    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.classList.toggle('dark-mode', theme === 'dark');
    document.documentElement.classList.toggle('light-mode', theme === 'light');
    document.documentElement.style.colorScheme = theme;

    // Define o fundo inicial antes de carregar os estilos do Angular.
    document.documentElement.style.backgroundColor =
      theme === 'dark' ? '#111827' : '#F0F4F7';
  })();
</script>

  <title>Desbravadores - Almirante Tamandaré</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gestão do Clube de Desbravadores Almirante Tamandaré: membros, tesouraria e atividades.">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Desbravadores">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/pwa/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
</head>

</body>
</html>
