<div class="treasury-page">
    <div class="title">
        <h1>Tesouraria</h1>
    </div>
    <section>
        <div class="kpi-components">
            <app-kpi-component
                icon="/icons/wallet-icon.svg"
                title="Saldo em caixa"
                value="R$1000"
                description="saldo disponível"
                backgroundColor="#E5F0FD"
            ></app-kpi-component>
            <app-kpi-component
                icon="/icons/arrow-icon-green.svg"
                title="Receita do mês"
                value="R$200"
                description="total de entradas"
                backgroundColor="#E3F9EC"
            ></app-kpi-component>
            <app-kpi-component
                icon="/icons/arrow-icon-red.svg"
                title="Despesas do mês"
                value="R$150"
                description="total do saldo"
                backgroundColor="#FFE2E5"
            ></app-kpi-component>
            <app-kpi-component
                icon="/icons/calendar-alert-outline.svg"
                title="Mensalidades pendentes"
                value="7"
                description="Em abertos"
                backgroundColor="#FFEAD4"
            ></app-kpi-component>
        </div>

        <div class="chart-container">
            <div class="chart-text">
                <span class="chart-title">Receitas x Despesas</span>
                <span class="chart-description">Últimos 6 meses</span>
            </div>

            <div class="chart-canvas-wrapper">
                <canvas
                    baseChart
                    [data]="barChartData"
                    [options]="barChartOptions"
                    type="bar"
                >
                </canvas>
            </div>
        </div>
        <app-financial-entries-component>
        </app-financial-entries-component>

    </section>
</div>
