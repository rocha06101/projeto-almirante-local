<div class="password-modal-backdrop" (click)="close()" (keydown.escape)="close()">
  <section
    class="password-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="password-modal-title"
    (click)="$event.stopPropagation()"
  >
    <header class="password-modal-header">
      <h2 id="password-modal-title">Alterar senha</h2>
      <button type="button" class="password-modal-close" aria-label="Fechar" (click)="close()" [disabled]="isSaving()">
        ×
      </button>
    </header>

    <form [formGroup]="passwordForm" (ngSubmit)="submitPasswordChange()">
      <div class="password-modal-body">
          <label class="password-modal-field" for="current-password">
            <span>Senha atual</span>
            <span class="password-modal-input">
              <input
                id="current-password"
                [type]="currentPasswordVisible() ? 'text' : 'password'"
                autocomplete="current-password"
                formControlName="senhaAtualSolicitante"
              >
              <app-password-toggle [(visible)]="currentPasswordVisible"></app-password-toggle>
            </span>
          </label>

          <label class="password-modal-field" for="new-password">
            <span>Nova senha</span>
            <span class="password-modal-input">
              <input
                id="new-password"
                [type]="newPasswordVisible() ? 'text' : 'password'"
                autocomplete="new-password"
                formControlName="novaSenha"
              >
              <app-password-toggle [(visible)]="newPasswordVisible"></app-password-toggle>
            </span>
          </label>

          <ul class="password-rules" aria-label="Regras da senha">
            @for (rule of passwordRules; track rule.key) {
              <li
                [class.neutral]="ruleStatus(rule.key) === 'neutral'"
                [class.valid]="ruleStatus(rule.key) === 'valid'"
                [class.invalid]="ruleStatus(rule.key) === 'invalid'"
                [attr.aria-label]="ruleStatus(rule.key) + ': ' + rule.label"
              >
                {{ rule.label }}
              </li>
            }
          </ul>
          <p class="password-server-rules">
            O servidor também verifica senhas comuns e se a nova senha contém seu e-mail.
          </p>

          <label class="password-modal-field" for="confirm-password">
            <span>Confirmar nova senha</span>
            <span
              class="password-modal-input"
              [class.neutral]="confirmationStatus === 'neutral'"
              [class.valid]="confirmationStatus === 'valid'"
              [class.invalid]="confirmationStatus === 'invalid'"
            >
              <input
                id="confirm-password"
                [type]="confirmPasswordVisible() ? 'text' : 'password'"
                autocomplete="new-password"
                formControlName="confirmacaoNovaSenha"
              >
              <app-password-toggle [(visible)]="confirmPasswordVisible"></app-password-toggle>
            </span>
          </label>
      </div>

      <footer class="password-modal-actions">
        <button type="button" class="password-modal-cancel" (click)="close()" [disabled]="isSaving()">Cancelar</button>
        <button type="submit" class="password-modal-save" [disabled]="!canSave">
          {{ isSaving() ? 'Salvando...' : 'Salvar' }}
        </button>
      </footer>
    </form>
  </section>
</div>
