@if (carregando()) {
  <p role="status">Carregando documento…</p>
}
@if (erro()) {
  <p class="erro" role="alert">{{ erro() }}</p>
}
<form (submit)="$event.preventDefault(); salvar()">
  <header class="editor-cabecalho">
  <div class="editor-identificacao">
    <a
      class="editor-voltar"
      routerLink="/secretaria"
      aria-label="Voltar à Secretaria"
      title="Voltar à Secretaria"
    >
      <span aria-hidden="true">←</span>
    </a>

    <input
      id="editor-titulo"
      class="editor-nome"
      aria-label="Nome do documento"
      placeholder="Nome do documento"
      required
      [value]="titulo()"
      (input)="titulo.set($any($event.target).value)"
    >
    <div class="editor-tipo">
  <label for="editor-tipo">Tipo de documento</label>
  <input
    id="editor-tipo"
    required
    [value]="tipo()"
    (input)="tipo.set($any($event.target).value)"
  >
</div>
  </div>

  <div class="editor-acoes" role="group" aria-label="Ações do documento">
   <button class="editor-acao-secundaria" type="button" disabled>
  Visualizar
</button>

<button class="editor-acao-secundaria" type="button" disabled>
  Exportar
</button>

    <app-refresh-button type="submit" [disabled]="carregando() || salvando()">
      Salvar documento
    </app-refresh-button>
  </div>
</header>
 
 <div class="editor-area">
  <div class="editor-ferramentas" role="group" aria-label="Formatação Markdown">
  <button type="button" disabled aria-label="Título" title="Título">H</button>
  <button type="button" disabled aria-label="Negrito" title="Negrito">
    <strong>B</strong>
  </button>
  <button type="button" disabled aria-label="Itálico" title="Itálico">
    <em>I</em>
  </button>
  <button type="button" disabled>Lista</button>
  <button type="button" disabled>Citação</button>
  <button type="button" disabled>Código</button>
  <button type="button" disabled>Link</button>
  <span class="editor-formato">Markdown (.md)</span>
</div>
  <div class="editor-paineis">
    
  <div class="editor-painel">
    <label for="editor-markdown">Editor Markdown</label>
    
    <textarea
      id="editor-markdown"
      required
      rows="14"
      [value]="markdown()"
      (input)="markdown.set($any($event.target).value)"
    ></textarea>
  </div>

  <section class="editor-painel" aria-labelledby="editor-previa-titulo">
    <h2 id="editor-previa-titulo">Pré vizualização</h2>
    <div class="editor-previa"></div>
  </section>
</div>
<footer class="editor-rodape">
  <span>Formato: Markdown</span>
  <span>Linhas: {{ markdown().split('\n').length }}</span>

  @if (salvando()) {
    <span class="editor-estado" role="status">Salvando…</span>
  }
</footer>
</div>
 
</form>
