<header class="topbar">
  <div class="topbar-container">
    <!-- Search Bar -->
    <div class="search-section">
      <div class="search-wrapper">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          type="text"
          class="search-input"
          placeholder="Pesquisar desbravadores, atividades..."
          [value]="searchQuery()"
          (input)="onSearch($event)"
        />
      </div>
    </div>

    <!-- Right Actions -->
    <div class="topbar-actions">
      <!-- Notifications -->
      <div class="notification-wrapper">
        <button
          class="action-btn notification-btn"
          (click)="toggleNotifications()"
          [class.active]="notificationOpen()"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          @if (notifications().length > 0) {
            <span class="badge">{{ notifications().length }}</span>
          }
        </button>

        @if (notificationOpen()) {
          <div class="notification-dropdown">
            <div class="dropdown-header">
              <h4>Notificações</h4>
              <button
                class="clear-btn"
                (click)="clearNotifications()"
                *ngIf="notifications().length > 0"
              >
                Limpar
              </button>
            </div>

            @if (notifications().length > 0) {
              <div class="notification-list">
                @for (notif of notifications(); track notif.id) {
                  <div class="notification-item" [class]="notif.type">
                    <span class="notif-message">{{ notif.message }}</span>
                    <span class="notif-time">{{ notif.timestamp }}</span>
                  </div>
                }
              </div>
            } @else {
              <div class="empty-state">
                <p>Nenhuma notificação</p>
              </div>
            }
          </div>
        }
      </div>

      <!-- Profile -->
      <div class="profile-wrapper">
        <button
          class="action-btn profile-btn"
          #profileButton
          (click)="toggleProfile()"
          [class.active]="profileOpen()"
        >
          <img [src]="userInfo.avatar" alt="Perfil" class="avatar" />
          <span class="user-name">{{ userInfo.name }}</span>
        </button>

        @if (profileOpen()) {
          <div class="profile-dropdown" #profilePopup>
            <div class="profile-header">
              <img [src]="userInfo.avatar" alt="Perfil" class="large-avatar" />
              <div class="user-info">
                <strong>{{ userInfo.name }}</strong>
                <small>{{ userInfo.role }}</small>
              </div>
            </div>

            <nav class="profile-menu">
              <button class="menu-item" (click)="viewProfile()">
                <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Meu Perfil</span>
              </button>
              <button class="menu-item">
                <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <span>Segurança</span>
              </button>
              <button class="menu-item">
                <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m4.24-4.24l4.24-4.24"></path>
                </svg>
                <span>Preferências</span>
              </button>
            </nav>

            <div class="profile-footer">
              <button class="logout-btn" (click)="logout()">
                <svg class="menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span>Sair do Sistema</span>
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</header>
