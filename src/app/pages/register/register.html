<div class="register-container">
    <main class="main-content">
        <div class="auth-shell">
        <div class="auth-card">

            <div class="content-title text-center">
                <div class="logo">
                    <img src="/images/logo.png" alt="Logo Almirante Tamandaré">
                </div>
                <h1 class="title">
                    <span class="first-text">Realizar </span>
                    <span class="second-text">Cadastro</span>
                </h1>
            </div>
            
            <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="input w-100">
                
                <app-select
                    label="Selecionar Cargo"
                    [options]="[
                      { label: 'Diretor', value: 'desbravador' },
                      { label: 'Tesoureiro', value: 'diretoria' },
                      { label: 'Secretário', value: 'conselheiro' },
                      { label: 'Almoxarifado', value: 'conselheiro' }
                    ]"
                    [arrow]="true"
                    icon="mail"
                ></app-select>

                <app-input
                    formControlName="name"
                    type="text"
                    name="name"
                    autocomplete="name"
                    iconSrc="/icons/user-icon.svg"
                    label="Nome Completo"
                    >                         
                </app-input>
                <app-input 
                formControlName="email"
                type="email"
                name="email"
                autocomplete="email"
                [invalid]="!!emailErrorMessage"
                describedBy="register-email-error"
                iconSrc="/icons/letter.svg"
                label="Email">
            </app-input>
            @if (emailErrorMessage) {
                <div class="field-error" id="register-email-error" role="alert">{{ emailErrorMessage }}</div>
            }
                <app-input 
                formControlName="password"
                type="password"
                name="password"
                autocomplete="new-password"
                iconSrc="/icons/padlock.svg"
                label="Senha">
                </app-input>
                
                <div class="container-validation">
                    <strong>A senha deve conter:</strong>
                    <br>
                    <span>No mínimo 6 caracteres</span>
                    <br>
                    <span>No mínimo um caractere especial</span>
                    <br>
                    <span>No mínimo uma letra maiúscula</span>
                    <br>
                    <span>No mínimo um número</span>
                </div>
                
                <app-input 
                formControlName="confirmPassword"
                type="password"
                name="confirmPassword"
                autocomplete="new-password"
                iconSrc="/icons/padlock.svg"
                label="Confirmar senha">
                </app-input>
            </div>
            <div class="button-register w-100">
                <app-button 
                type="submit"
                label="Cadastrar">
                </app-button>
            </div>
            </form>
        </div>
    </div>
    </main>
    <div class="footer">
        <div class="img-footer">
            <img src="/images/logo-desbravadores.png" alt="Logo Desbravadores">
        </div>
        <span>Clube de Desbravadores - Almirante Tamandaré</span>
    </div>
</div>
