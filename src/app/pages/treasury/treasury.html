<div class="treasury-page">
    <div class="title">
        <h1>Tesouraria</h1>
    </div>
    <section>
        <div class="kpi-components">
            <app-kpi-component
                icon="icons/wallet-icon.svg"
                title="Saldo em caixa"
                value="R$1000"
                description="saldo disponível"
                backgroundColor="#E5F0FD"
            ></app-kpi-component>
            <app-kpi-component
                icon="icons/arrow-icon-green.svg"
                title="Receita do mês"
                value="R$200"
                description="total de entradas"
                backgroundColor="#E3F9EC"
            ></app-kpi-component>
            <app-kpi-component
                icon="icons/arrow-icon-red.svg"
                title="Despesas do mês"
                value="R$150"
                description="total do saldo"
                backgroundColor="#FFE2E5"
            ></app-kpi-component>
            <app-kpi-component
                icon="icons/calendar-alert-outline.svg"
                title="Mensadlidades pendentes"
                value="7"
                description="Em abertos"
                backgroundColor="#FFEAD4"
            ></app-kpi-component>
        </div>

        <div class="chart-container">
            <div class="chart-text">
                <span class="chart-title">Receitas X Despesas</span>
                <span class="chart-description">Últimos 6 meses</span>
            </div>
        </div>

        <div class="quick-actions">
            <div class="quick-actions-text">Ações rápidas</div>

            <div class="quick-actions-list">
                <app-action-component
                    icon="icons/more-icon.svg"
                    actionText="Registrar receita"
                    hoverBorderColor="#2F00FC"
                    hoverTextColor="#2F00FC"
                ></app-action-component>

                <app-action-component
                    icon="icons/minus-circle-line.svg"
                    actionText="Registrar Despesa"
                    hoverBorderColor="#FF0000"
                    hoverTextColor="#FF0000"
                ></app-action-component>

                <app-action-component
                    icon="icons/dollar-sign.svg"
                    actionText="Registrar Pagamento"
                    hoverBorderColor="#00962C"
                    hoverTextColor="#00962C"
                ></app-action-component>

                    <app-action-component
                    icon="icons/paper-icon.svg"
                    actionText="Emitir relatório"
                    hoverBorderColor="#2F00FC"
                    hoverTextColor="#2F00FC"
                ></app-action-component>
            </div>
        </div>
    </section>
</div>
