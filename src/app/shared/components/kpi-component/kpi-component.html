<div class="kpi-component">
    
    <div class="kpi-image">
        <div class="image-container" [style.background-color]="backgroundColor">
            <img [src]="icon">
        </div>
    </div> 
    
    <div class="kpi-body">
        <div class="title">{{ title }}</div>
        <div class="value">{{ value }}</div>
        <div class="description">{{ description }}</div>
    </div>
       
</div>
