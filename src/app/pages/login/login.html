<div class="login-container" [class.is-loading]="loading">
    <div class="main-content container-fluid px-3 py-5">
        <div class="auth-shell col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="auth-card">
            <div class="content-title text-center">
                <div class="logo">
                    <img src="/images/logo.png" alt="Logo Almirante Tamandaré">
                </div>
                <div class="title">
                    <span class="first-text">Realizar  </span>
                    <span class="second-text">Login</span>
                </div>
            </div>
            <form [formGroup]="form" (ngSubmit)="submit()" style="display: contents">
            <div class="input w-100">
                <app-input 
                formControlName="email"
                type="email"
                iconSrc="/icons/letter.svg"
                label="Email">
                </app-input>
                @if (emailErrorMessage) {
                    <div class="field-error">{{ emailErrorMessage }}</div>
                }
                <app-input 
                formControlName="password"
                type="password"
                iconSrc="/icons/padlock.svg"
                label="Senha">
                </app-input>
            </div>
            <div *ngIf="error" style="color: red; text-align: center;">{{ error }}</div>
            <div class="button-login w-100">
                <app-button 
                type="submit"
                label="Entrar">
                </app-button>
                <div class="first-div"><a href="">Esqueci a senha</a></div>
                <div class="second-div">Não tem conta? <a href="/register">Cadastrar-se</a></div>
            </div>
            </form>
        </div>
    </div>
    </div>
    <div class="footer">
        <div class="img-footer">
            <img src="/images/logo-desbravadores.png" alt="Logo Desbravadores">
        </div>
        <span>Clube de Desbravadores - Almirante Tamandaré</span>
    </div>
    @if (loading) {
        <div class="loading-overlay" aria-live="polite" aria-busy="true">
            <div class="loading-box">
                <div class="loading-spinner"></div>
                <span>Validando acesso...</span>
            </div>
        </div>
    }
</div>
